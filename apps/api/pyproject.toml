[project]
name = "podcast-ops-api"
version = "0.1.0"
description = "Local FastAPI wrapper for the Podcast-Ops studio pipeline"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false
